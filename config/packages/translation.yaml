security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    
    providers:
        users_in_memory:
            memory:
                users:
                    admin: { password: '$2y$13$rBZocz0MCeUfc4x1YKN1OuqD0a6gRG9NPrnfp.D2wqCXKKh4zD3Oy', roles: ['ROLE_ADMIN'] }
                    # Mot de passe : admin123

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: login
                check_path: login
            logout:
                path: logout
                target: /

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }