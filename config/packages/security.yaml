security:
    # Configuration des encodeurs de mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    
    # Fournisseurs d'utilisateurs
    providers:
        users_in_memory:
            memory:
                users:
                    admin: 
                        password: '$2y$13$NtDROl4iyw/zJol2el27k.9O/78XAfVGIYQIzj6WLa.McU8rir62e'
                        roles: ['ROLE_ADMIN']
              

    # Configuration des firewalls
    firewalls:
        # Firewall pour les outils de développement
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
            
        # Firewall principal avec protection renforcée
        main:
            lazy: true
            provider: users_in_memory
            
            # Configuration du formulaire de connexion
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: admin_procedure_index
                always_use_default_target_path: true
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                
            # Configuration de la déconnexion - CORRECTION PRINCIPALE
            logout:
                path: app_logout
                target: app_login  # Redirection vers la page de connexion
                invalidate_session: true
                delete_cookies: []
                # CORRECTION: Désactivation du CSRF pour éviter les erreurs de token
                enable_csrf: false

    # Contrôle d'accès renforcé
    access_control:
        # Page de connexion accessible publiquement
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Protection stricte de toutes les routes d'administration
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Redirection forcée vers login pour les utilisateurs non authentifiés tentant d'accéder à /admin
        - { path: ^/admin, roles: IS_AUTHENTICATED_FULLY }